version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
        emit_json_tags: true
        json_tags_case_style: "camel"
